# menu
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>外星人數學大冒險 - 數字選擇版</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --card-bg: rgba(255, 255, 255, 0.12);
            --card-border: rgba(255, 255, 255, 0.25);
            --text-color: #ffffff;
            --accent-color: #0a84ff; /* iOS 藍色 */
            --accent-hover: #0062d2;
            --key-bg: rgba(255, 255, 255, 0.18);
            --key-active: rgba(255, 255, 255, 0.4);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 煙花畫布層 */
        #fireworksCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .game-container {
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--card-border);
            max-width: 400px;
            width: 100%;
            padding: 20px 25px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            box-sizing: border-box;
            position: relative;
            z-index: 5;
        }

        .alien-avatar {
            font-size: 3.2rem;
            margin-bottom: 2px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h2 {
            margin: 2px 0 12px 0;
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.25);
            padding: 8px 12px;
            border-radius: 14px;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        /* 直式計算區域 */
        .vertical-math {
            font-size: 2.6rem;
            font-weight: 700;
            text-align: right;
            display: inline-block;
            margin: 10px 0 15px 0;
            border-bottom: 4px solid rgba(255, 255, 255, 0.7);
            padding-bottom: 8px;
            letter-spacing: 12px;
        }

        .math-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            position: relative;
        }

        .operator {
            position: absolute;
            left: -32px;
        }

        /* 數字顯示格 */
        .digit-inputs-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 10px 0;
            min-height: 60px;
            align-items: center;
        }

        .digit-box {
            font-size: 2rem;
            font-weight: 600;
            width: 50px;
            height: 58px;
            line-height: 58px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.35);
            background: rgba(0, 0, 0, 0.25);
            color: white;
            border-radius: 14px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
            transition: all 0.2s;
        }

        .digit-box.active {
            border-color: var(--accent-color);
            box-shadow: 0 0 12px rgba(10, 132, 255, 0.7);
            background: rgba(10, 132, 255, 0.15);
        }

        /* 觸控數字選擇盤 (iOS 風格) */
        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .key-btn {
            font-size: 1.5rem;
            font-weight: 600;
            padding: 12px 0;
            background: var(--key-bg);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: background 0.15s, transform 0.1s;
        }

        .key-btn:active {
            background: var(--key-active);
            transform: scale(0.95);
        }

        .key-btn.action-key {
            background: rgba(255, 69, 58, 0.25);
            border-color: rgba(255, 69, 58, 0.4);
        }

        .key-btn.submit-key {
            background: var(--accent-color);
            border-color: var(--accent-color);
            font-size: 1.2rem;
        }

        #feedback {
            font-size: 1rem;
            margin-top: 12px;
            min-height: 32px;
            line-height: 1.3;
        }

        /* 答錯時的大型 X 提示特效 */
        #wrongOverlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 8rem;
            color: #ff453a;
            font-weight: bold;
            z-index: 20;
            pointer-events: none;
            transition: transform 0.2s ease-out, opacity 0.2s;
            opacity: 0;
            text-shadow: 0 0 25px rgba(0,0,0,0.8);
        }

        #wrongOverlay.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }
    </style>
</head>
<body>

<canvas id="fireworksCanvas"></canvas>
<div id="wrongOverlay">❌</div>

<div class="game-container">
    <div class="alien-avatar">🛸👾</div>
    <h2>外星人數學大冒險</h2>
    
    <div class="stats-bar">
        <span>關卡: <b id="level">1</b> / 5</span>
        <span>進度: <b id="current">1</b> / 50</span>
        <span>⭐ <b id="score">0</b></span>
    </div>
    
    <div class="vertical-math">
        <div id="num1">25</div>
        <div class="math-row">
            <span id="operator" class="operator">+</span>
            <span id="num2">17</span>
        </div>
    </div>
    
    <!-- 答案數字顯示格 -->
    <div class="digit-inputs-container" id="digitInputsContainer"></div>

    <!-- 數字選擇按鍵盤 -->
    <div class="keypad-grid">
        <button class="key-btn" onclick="pressNum(1)">1</button>
        <button class="key-btn" onclick="pressNum(2)">2</button>
        <button class="key-btn" onclick="pressNum(3)">3</button>
        <button class="key-btn" onclick="pressNum(4)">4</button>
        <button class="key-btn" onclick="pressNum(5)">5</button>
        <button class="key-btn" onclick="pressNum(6)">6</button>
        <button class="key-btn" onclick="pressNum(7)">7</button>
        <button class="key-btn" onclick="pressNum(8)">8</button>
        <button class="key-btn" onclick="pressNum(9)">9</button>
        <button class="key-btn action-key" onclick="clearLastDigit()">⌫</button>
        <button class="key-btn" onclick="pressNum(0)">0</button>
        <button class="key-btn submit-key" onclick="checkAnswer()">發射🚀</button>
    </div>
    
    <div id="feedback"></div>
</div>

<script>
    let currentQ = 1;
    let score = 0;
    let numA, numB, op, correctAnswer;
    let expectedLength = 2; 
    let currentInputDigits = [];

    // 煙花粒子系統
    const canvas = document.getElementById('fireworksCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.color = color;
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 6 + 2;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.alpha = 1;
            this.decay = Math.random() * 0.015 + 0.01;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += 0.08;
            this.alpha -= this.decay;
        }
        draw() {
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    function createFireworks() {
        const colors = ['#0a84ff', '#30d158', '#ff9f0a', '#ff453a', '#bf5af2', '#ffff00'];
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2 - 50;
        for (let i = 0; i < 60; i++) {
            particles.push(new Particle(cx, cy, colors[Math.floor(Math.random() * colors.length)]));
        }
    }

    function animateFireworks() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach((p, index) => {
            p.update();
            p.draw();
            if (p.alpha <= 0) particles.splice(index, 1);
        });
        if (particles.length > 0) {
            requestAnimationFrame(animateFireworks);
        }
    }

    // 音效合成
    function playSound(type) {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'correct') {
            osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
            osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.35);
        } else {
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.setValueAtTime(130, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.35);
        }
    }

    function generateQuestion() {
        if (currentQ > 50) {
            alert("🌟 太神啦！你成功解救了外星星球，成為數學宇宙霸主！");
            currentQ = 1;
            score = 0;
        }
        
        op = Math.random() > 0.5 ? '+' : '-';
        if (op === '+') {
            numA = Math.floor(Math.random() * 70) + 15;
            numB = Math.floor(Math.random() * 70) + 15;
            correctAnswer = numA + numB;
        } else {
            numA = Math.floor(Math.random() * 70) + 30;
            numB = Math.floor(Math.random() * (numA - 10)) + 10;
            correctAnswer = numA - numB;
        }

        document.getElementById('num1').innerText = numA;
        document.getElementById('operator').innerText = op;
        document.getElementById('num2').innerText = numB;
        document.getElementById('current').innerText = currentQ;
        document.getElementById('level').innerText = Math.ceil(currentQ / 10);
        document.getElementById('score').innerText = score;
        document.getElementById('feedback').innerText = '';

        expectedLength = correctAnswer.toString().length;
        currentInputDigits = [];
        updateDigitDisplay();
    }

    function updateDigitDisplay() {
        const container = document.getElementById('digitInputsContainer');
        container.innerHTML = '';

        for (let i = 0; i < expectedLength; i++) {
            const box = document.createElement('div');
            box.className = 'digit-box';
            
            if (i < currentInputDigits.length) {
                box.innerText = currentInputDigits[i];
            } else {
                box.innerText = '';
            }

            if (i === currentInputDigits.length) {
                box.classList.add('active'); // 高亮目前輸入位數
            }

            container.appendChild(box);
        }
    }

    function pressNum(num) {
        if (currentInputDigits.length < expectedLength) {
            currentInputDigits.push(num);
            updateDigitDisplay();
        }
    }

    function clearLastDigit() {
        if (currentInputDigits.length > 0) {
            currentInputDigits.pop();
            updateDigitDisplay();
        }
    }

    function checkAnswer() {
        const feedback = document.getElementById('feedback');

        if (currentInputDigits.length < expectedLength) {
            feedback.style.color = "#ff9f0a";
            feedback.innerText = "太空人！請點擊數字按紐填滿答案格喔！";
            return;
        }

        const userAns = parseInt(currentInputDigits.join(''));

        if (userAns === correctAnswer) {
            playSound('correct');
            score += 10;
            feedback.style.color = "#30d158";
            feedback.innerText = "🎯 太棒了！能量補充成功！🎉";
            
            // 觸發煙花特效
            createFireworks();
            animateFireworks();

            currentQ++;
            setTimeout(generateQuestion, 1600);
        } else {
            playSound('wrong');
            feedback.style.color = "#ff453a";
            feedback.innerText = "⚠️ 哎呀能量偏離！提示：再算一次個位和十位有沒有進位/借位喔！";
            
            // 顯示畫面大型 X 特效
            const overlay = document.getElementById('wrongOverlay');
            overlay.classList.add('show');
            setTimeout(() => {
                overlay.classList.remove('show');
            }, 600);
        }
    }

    generateQuestion();
</script>

</body>
</html>
