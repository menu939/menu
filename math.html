<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>變形金剛：數學防衛戰</title>
    <style>
        :root {
            --dark-panel: #111418;
            --cyber-yellow: #ffe600;
            --cyber-blue: #00e5ff;
            --cyber-red: #ff2a2a;
            --text-color: #fff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0d10;
            background-image: 
                radial-gradient(circle at 50% 40%, rgba(255, 215, 0, 0.2) 0%, rgba(10, 10, 15, 0.9) 70%),
                linear-gradient(rgba(255, 230, 0, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 230, 0, 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-10px, 2px) rotate(-1deg); }
            40% { transform: translate(10px, -2px) rotate(1deg); }
            60% { transform: translate(-8px, 1px) rotate(-0.5deg); }
            80% { transform: translate(8px, -1px) rotate(0.5deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .shake-effect {
            animation: shake 0.4s ease-in-out;
        }

        .container {
            background-color: var(--dark-panel);
            border: 4px solid var(--cyber-yellow);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 25px rgba(255, 230, 0, 0.3);
            width: 100%;
            max-width: 480px;
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
            transition: all 0.2s;
            z-index: 10;
        }

        .container.success-flash {
            border-color: var(--cyber-blue);
            box-shadow: 0 0 35px rgba(0, 229, 255, 0.9);
        }

        .container.error-flash {
            border-color: var(--cyber-red);
            box-shadow: 0 0 35px rgba(255, 42, 42, 0.9);
        }

        h1 {
            color: var(--cyber-yellow);
            font-size: 2rem;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px #000;
        }

        .subtitle {
            color: var(--cyber-blue);
            font-size: 1rem;
            margin-bottom: 20px;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .vertical-math {
            display: inline-block;
            font-family: monospace;
            font-size: 3rem;
            font-weight: bold;
            text-align: right;
            margin: 10px 0 20px 0;
            background: #1f242d;
            color: #fff;
            padding: 15px 40px;
            border-radius: 12px;
            border: 3px solid var(--cyber-yellow);
            box-shadow: inset 0 0 15px rgba(255, 230, 0, 0.2);
        }

        .math-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            letter-spacing: 12px;
        }

        .math-operator {
            margin-right: 20px;
            color: var(--cyber-yellow);
        }

        .math-line {
            border-bottom: 5px solid #fff;
            margin: 5px 0 15px 0;
            width: 150px;
            margin-left: auto;
        }

        .number-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .num-btn {
            background: linear-gradient(135deg, #2b313b 0%, #1a1f26 100%);
            color: var(--cyber-yellow);
            border: 2px solid var(--cyber-yellow);
            font-size: 1.5rem;
            font-weight: bold;
            padding: 12px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .num-btn:hover {
            background: var(--cyber-yellow);
            color: #000;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(255, 230, 0, 0.4);
        }

        .num-btn:active {
            transform: translateY(1px);
        }

        .btn {
            background: linear-gradient(135deg, var(--cyber-yellow) 0%, #cca300 100%);
            color: #000;
            border: none;
            padding: 14px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 20px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.6);
        }

        .feedback {
            font-size: 1.4rem;
            font-weight: bold;
            margin: 15px 0;
            min-height: 35px;
            text-shadow: 1px 1px 2px #000;
        }

        .feedback.success {
            color: var(--cyber-blue);
        }

        .feedback.error {
            color: var(--cyber-red);
        }

        .progress-info {
            font-size: 1rem;
            color: var(--cyber-yellow);
            margin-bottom: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }

        p {
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <!-- 開始畫面 -->
    <div id="start-screen" class="screen active">
        <h1>變型金剛</h1>
        <div class="subtitle">AUTOBOTS MATH PROTOCOL</div>
        <p style="margin: 25px 0; line-height: 1.6;">指揮官，賽博坦能源庫告急！<br>請完成 20 道個位數數學防衛直式計算，點擊 0-9 數字格子回答，為基地充能！</p>
        <button class="btn" onclick="startMathGame()">啟動系統</button>
    </div>

    <!-- 遊戲畫面 -->
    <div id="game-screen" class="screen">
        <div class="progress-info" id="progress-text">進度：1 / 20</div>
        
        <!-- 直式數學顯示區 -->
        <div class="vertical-math">
            <div class="math-row" id="num1-row">5</div>
            <div class="math-row">
                <span class="math-operator" id="operator-sign">+</span>
                <span id="num2-row">3</span>
            </div>
            <div class="math-line"></div>
            <div id="selected-answer-display" style="color: var(--cyber-yellow); text-align: right; min-height: 50px;">?</div>
        </div>

        <!-- 數字格子選擇區 (0 ~ 9) -->
        <div class="number-grid" id="number-grid"></div>

        <div class="feedback" id="feedback-msg"></div>
    </div>

    <!-- 結算畫面 -->
    <div id="result-screen" class="screen">
        <h1>任務完成</h1>
        <div class="subtitle">CYBERTRON SECURED</div>
        <p id="final-score" style="font-size: 1.4rem; margin: 30px 0;"></p>
        <button class="btn" onclick="resetMathGame()">再次出擊</button>
    </div>
</div>

<script>
    let questions = [];
    let currentIndex = 0;
    let score = 0;
    let answered = false;

    // 產生 20 題不重複的個位數加減法
    function generateQuestions() {
        let set = new Set();
        let list = [];
        
        while(list.length < 20) {
            let isAdd = Math.random() > 0.5;
            let n1 = Math.floor(Math.random() * 9) + 1;
            let n2 = Math.floor(Math.random() * 9) + 1;
            
            let ans = isAdd ? (n1 + n2) : (n1 - n2);
            
            if (!isAdd && ans < 0) {
                let temp = n1; n1 = n2; n2 = temp;
                ans = n1 - n2;
            }
            if (isAdd && ans > 9) continue;

            let key = `${n1}${isAdd ? '+' : '-'}${n2}`;
            
            if(!set.has(key)) {
                set.add(key);
                list.push({ n1: n1, n2: n2, op: isAdd ? '+' : '-', ans: ans });
            }
        }
        return list;
    }

    function startMathGame() {
        try {
            questions = generateQuestions();
            currentIndex = 0;
            score = 0;
            
            document.getElementById('start-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            document.getElementById('result-screen').classList.remove('active');
            
            buildNumberGrid();
            loadQuestion();
        } catch (e) {
            alert('啟動發生錯誤: ' + e.message);
        }
    }

    function buildNumberGrid() {
        let grid = document.getElementById('number-grid');
        grid.innerHTML = '';
        for (let i = 0; i <= 9; i++) {
            let btn = document.createElement('button');
            btn.className = 'num-btn';
            btn.innerText = i;
            btn.onclick = () => selectAnswer(i);
            grid.appendChild(btn);
        }
    }

    function loadQuestion() {
        answered = false;
        let q = questions[currentIndex];
        document.getElementById('progress-text').innerText = `進度：${currentIndex + 1} / 20`;
        document.getElementById('num1-row').innerText = q.n1;
        document.getElementById('operator-sign').innerText = q.op;
        document.getElementById('num2-row').innerText = q.n2;
        
        document.getElementById('selected-answer-display').innerText = '?';
        document.getElementById('feedback-msg').innerText = '';
        document.getElementById('feedback-msg').className = 'feedback';
        
        let container = document.getElementById('main-container');
        container.classList.remove('success-flash', 'error-flash');
    }

    function selectAnswer(userVal) {
        if (answered) return;
        answered = true;

        let q = questions[currentIndex];
        let feedback = document.getElementById('feedback-msg');
        let container = document.getElementById('main-container');
        let display = document.getElementById('selected-answer-display');
        
        display.innerText = userVal;

        container.classList.remove('shake-effect', 'success-flash', 'error-flash');
        void container.offsetWidth; 

        if (userVal === q.ans) {
            score++;
            feedback.innerText = '太棒了！';
            feedback.className = 'feedback success';
            container.classList.add('success-flash');
        } else {
            feedback.innerText = '差一點！';
            feedback.className = 'feedback error';
            container.classList.add('shake-effect', 'error-flash');
        }

        setTimeout(() => {
            currentIndex++;
            if (currentIndex < questions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }, 900);
    }

    function showResult() {
        document.getElementById('game-screen').classList.remove('active');
        document.getElementById('result-screen').classList.add('active');
        document.getElementById('final-score').innerHTML = `防衛結算：答對 <span style="color: var(--cyber-blue);">${score}</span> / 20 題<br><br>${score === 20 ? '「博派核心全開，完美防衛！」' : '「系統運作正常，再接再厲！」'}`;
    }

    function resetMathGame() {
        document.getElementById('result-screen').classList.remove('active');
        document.getElementById('start-screen').classList.add('active');
    }
</script>

</body>
</html>
